<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML FORM</title>

    <link rel="stylesheet" href="styles/poll-form.css">

</head>

<body>
    <header>
        <p>WDD 130 | HTML Form - User Poll</p>
    </header>

    <main>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

            <label for="favorite browser">What is your favorite internet browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="safari">Safari</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Microfost edge</option>
                <option value="other">other</option>
            </select>

            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="households">List the places you have lived</label>
            <textarea name="households" id="households" rows="4"></textarea>

            <button type="submit">Submit</button>

        </form>

    </main>

    <footer>
        <p>©2026 ↕️ Menteros ↕️ Augustine Barasa </p>
    </footer>

</body>

</html>
