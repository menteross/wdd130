<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <link rel="stylesheet" href="styles/sample2.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Whitewater Rafting Logo">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1>Contact Us</h1>

        <section class="company-info">
            <div class="address-details">
                <h2>Our Headquarters</h2>
                <p>573-00500</p>
                <p>Nairobi, Kenya</p>
                <p>+254768723835</p>
                <p>menterosrafting@gmail.com</p>
            </div>

            <div class="map-container">
                <h2>Find Us Here</h2>
                <!-- Embedded Google Map -->
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7505.886657775306!2d37.145024972311234!3d-1.2308903719594273!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2ske!4v1785780016324!5m2!1sen!2ske"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>


        <!-- Form -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <!-- Name -->
                <div class="form-item">
                    <label for="username">Name:</label>
                    <input type="text" id="username" name="username" placeholder="Your Name"
                      required>
                </div>

                <!-- Email -->
                <div class="form-item">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail"
                      placeholder="name@example.com" required>
                </div>

                <!-- Purpose of Message -->
                <fieldset class="form-item purpose-group">
                    <legend>Purpose of your message:</legend>

                    <div class="radio-option">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <!-- Message Box -->
                <!-- Message Box -->
                <div class="message-box">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type here."
                      required></textarea>

                    <!-- Newsletter Subscription -->
                    <div class="form-item checkbox-item">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-item">
                        <button type="submit" class="submit-btn">Submit</button>
                    </div>
            </form>
        </section>

        <!-- Employees -->
        <section class="employees">
            <h2>We are here to serve you</h2>
            <div class="employee-grid">
                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="Photo of Marion Jael">
                    <figcaption>
                        <h3>Marion Jael</h3>
                        <p class="title">General Manager</p>
                    </figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Photo of Jeremy Maina">
                    <figcaption>
                        <h3>Jeremy Maina</h3>
                        <p class="title">Lead River Guide</p>
                    </figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Photo of Lewis Kamau">
                    <figcaption>
                        <h3>Lewis Kamau</h3>
                        <p class="title">Customer Service & Reservations Manager</p>
                    </figcaption>
                </figure>
            </div>
        </section>


    </main>

    <footer>
        <p>&copy; 2026 Whitewater Rafting | All Rights Reserved</p>
        <p><a href="wireframes.html">Wireframes</a></p>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                  alt="Facebook Icon"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
                  alt="Twitter Icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </div>
    </footer>
</body>

</html>
