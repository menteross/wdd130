<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us | Menteros Rafting</title>
    <meta name="description"
      content="Locate us or Contact us if you have any questions or inquiries about Menteros Rafting.">
    <meta name="author" content="Augustine Barasa">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg"
          alt="Rafting Compass and navigation map on wooden desk" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">
        <section class="company-header-info">
            <h1>Menteros Rafting</h1>
            <p>573-00500</p>
            <p>Nairobi, Kenya</p>
            <p>+254768723835</p>
            <p>menterosrafting@gmail.com</p>
            <section>
                <!-- Map -->
                <div class="map-container">
                    <section class="map-container">
                        <h2>Find Us Here</h2>
                        <iframe
                          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7505.886657775306!2d37.145024972311234!3d-1.2308903719594273!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2ske!4v1785780016324!5m2!1sen!2ske"
                          width="600" height="450" allowfullscreen="" loading="lazy"
                          referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </section>
                    <!-- Form -->
                    <section class="form-container">
                        <h2>Send Us a Message</h2>
                        <form action="#" method="post" class="contact-form">
                            <!-- Name -->
                            <div class="form-row">
                                <label for="username">Name:</label>
                                <input type="text" id="username" name="username"
                                  placeholder="Your Name" required>
                            </div>
                            <!-- Email -->
                            <div class="form-row">
                                <label for="useremail">Email Address:</label>
                                <input type="email" id="useremail" name="useremail"
                                  placeholder="name@example.com" required>
                            </div>
                            <!-- Purpose of Message -->
                            <div class="form-row form-row-top">
                                <span class="label-text">Message Purpose</span>
                                <div class="radio-options">
                                    <div class="radio-option">
                                        <input type="radio" id="general" name="purpose"
                                          value="general" checked>
                                        <label for="general">General Inquiry</label>
                                    </div>
                                    <div class="radio-option">
                                        <input type="radio" id="reservation" name="purpose"
                                          value="reservation">
                                        <label for="reservation">Reservation Question</label>
                                    </div>
                                    <div class="radio-option">
                                        <input type="radio" id="suggestion" name="purpose"
                                          value="suggestion">
                                        <label for="suggestion">Website Suggestion</label>
                                    </div>
                                </div>
                            </div>
                            <!-- Message Box -->
                            <div class="form-row form-row-top">
                                <label for="message">Message:</label>
                                <textarea id="message" name="message" rows="5"
                                  placeholder="Type here...." required></textarea>
                                <!-- Newsletter Subscription -->
                                <div class="checkbox-row">
                                    <input type="checkbox" id="newsletter" name="newsletter"
                                      value="yes">
                                    <label for="newsletter">Please subscribe me to the monthly
                                        newsletter</label>
                                </div>
                                <!-- Submit Button -->
                                <button type="submit" class="submit-btn">Send Message</button>
                            </div>
                        </form>
                    </section>
                    <!-- Employees -->
                    <section class="employees">
                        <h2>We are here to serve you</h2>
                        <div class="employee-grid">
                            <figure class="employee-card">
                                <img src="images/employee1.jpg"
                                  alt="Marion Jael, General Manager at Menteros Rafting">
                                <figcaption>
                                    <h3>Marion Jael</h3>
                                    <p class="title">General Manager</p>
                                </figcaption>
                            </figure>
                            <figure class="employee-card">
                                <img src="images/employee2.jpg"
                                  alt="Jeremy Maina, Lead River Guide">
                                <figcaption>
                                    <h3>Jeremy Maina</h3>
                                    <p class="title">Lead River Guide</p>
                                </figcaption>
                            </figure>
                            <figure class="employee-card">
                                <img src="images/employee3.jpg"
                                  alt="Lewis Kamau, Customer Service Specialist">
                                <figcaption>
                                    <h3>Lewis Kamau</h3>
                                    <p class="title">Customer Service and Reservations Manager</p>
                                </figcaption>
                            </figure>
                        </div>
                    </section>


    </main>

    <footer>
        <p>©2026 ↕️ Menteros Rafting ↕️ Augustine Barasa </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook2.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedein2.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram2.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
